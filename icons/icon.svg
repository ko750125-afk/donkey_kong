  <!-- Classic Barrel in Center Bottom -->
  <rect x="27" y="41" width="10" height="10" fill="#e46800"/>
  <rect x="27" y="43" width="10" height="2" fill="#00d8ff"/>
  <rect x="27" y="47" width="10" height="2" fill="#00d8ff"/>
</svg>
