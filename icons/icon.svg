  <rect x="35" y="19" width="3" height="3" fill="#000000"/>
  <rect x="25" y="23" width="14" height="2" fill="#ffffff"/>
  <!-- Torso & Arms -->
  <rect x="14" y="26" width="36" height="14" fill="#a84400"/>
  <rect x="24" y="28" width="16" height="10" fill="#f8b878"/>
  <!-- Hands holding Barrel -->
  <rect x="10" y="30" width="6" height="10" fill="#a84400"/>
  <rect x="48" y="30" width="6" height="10" fill="#a84400"/>
  <!-- Legs -->
  <rect x="18" y="40" width="8" height="10" fill="#a84400"/>
  <rect x="38" y="40" width="8" height="10" fill="#a84400"/>
  <rect x="16" y="48" width="10" height="4" fill="#f8b878"/>
