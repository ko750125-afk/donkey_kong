<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>동키콩 (1981) — Donkey Kong Classic</title>
  <meta name="description" content="1981년 닌텐도 아케이드 오리지널 동키콩(25m·50m·75m·100m) PWA 클론 게임" />
  <meta name="theme-color" content="#e60012" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="동키콩 1981" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Retro Pixel Font & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 오직 게임 화면만 중앙에 표시하는 컨테이너 -->
  <main class="game-only-stage">
    <div id="crtScreen" class="crt-screen scanlines">
      <canvas id="gameCanvas" width="448" height="512" aria-label="동키콩 1981 게임 화면"></canvas>
      <!-- 우측 상단 단독 설정 버튼 -->
      <button type="button" id="btnSettings" class="settings-fab" title="게임 설정 열기 (단축키 Esc 또는 P)" aria-label="설정">
        ⚙️ 설정
      </button>
    </div>
  </main>

  <!-- 필수 설정 전용 모달 -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settingsTitle">⚙️ 게임 설정</h2>
        <button type="button" id="btnCloseSettings" class="modal-close" aria-label="닫기">✕</button>
      </div>

      <div class="settings-list">
        <div class="setting-row">
          <span class="setting-label">사운드 (단축키 M)</span>
          <button type="button" id="btnSound" class="setting-btn active">🔊 사운드 ON</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">CRT 브라운관 효과</span>
          <button type="button" id="btnCrt" class="setting-btn active">📺 CRT ON</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">스테이지 이동 (단축키 1~4)</span>
          <div class="stage-warp-group">
            <button type="button" class="stage-btn active" data-stage="1">25m</button>
            <button type="button" class="stage-btn" data-stage="2">50m</button>
            <button type="button" class="stage-btn" data-stage="3">75m</button>
            <button type="button" class="stage-btn" data-stage="4">100m</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">게임 진행</span>
          <button type="button" id="btnRestartGame" class="setting-btn restart-btn">🔄 처음부터 재시작</button>
        </div>

        <div id="pwaInstallRow" class="setting-row hidden">
          <span class="setting-label">앱으로 설치 (오프라인 지원)</span>
          <button type="button" id="btnInstallPwa" class="setting-btn install-btn">📲 앱 설치 (PWA)</button>
        </div>
      </div>

      <p class="settings-hint">조작: 방향키(이동/사다리) · Space/Z(점프) · Enter(시작)</p>
    </div>
  </div>

  <!-- 게임 스크립트 -->
  <script src="./js/audio.js"></script>
  <script src="./js/sprites.js"></script>
  <script src="./js/stages.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/pwa.js"></script>
</body>
</html>
