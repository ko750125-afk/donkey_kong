<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>동키콩 (1981) — Donkey Kong Classic PWA</title>
  <meta name="description" content="1981년 닌텐도 아케이드 오리지널 동키콩(25m·50m·75m·100m) 모바일/PC 지원 PWA 게임" />
  <meta name="theme-color" content="#050508" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="동키콩 1981" />

  <!-- 카카오톡 / 문자 / SNS 공유 미리보기 (Open Graph) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🦍 동키콩 (1981) — 아케이드 클래식 PWA 게임" />
  <meta property="og:description" content="열쇠를 찾아 폴린을 구출하세요! 스마트폰과 PC 어디서나 바로 플레이 가능한 1981 오리지널 동키콩" />
  <meta property="og:image" content="./icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="🦍 동키콩 (1981) — 아케이드 클래식 PWA" />
  <meta name="twitter:description" content="스마트폰·PC에서 바로 즐기는 1981년 오리지널 아케이드 동키콩!" />
  <meta name="twitter:image" content="./icons/icon-512.png" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Retro Pixel Font & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 게임 화면 + 모바일 전용 터치 패드 컨테이너 -->
  <main class="game-only-stage">
    <div id="crtScreen" class="crt-screen scanlines">
      <canvas id="gameCanvas" width="448" height="512" aria-label="동키콩 1981 게임 화면"></canvas>
      <!-- 우측 상단 단독 설정 버튼 -->
      <button type="button" id="btnSettings" class="settings-fab" title="게임 설정 열기 (단축키 Esc 또는 P)" aria-label="설정">
        ⚙️ 설정
      </button>
    </div>

    <!-- 모바일/태블릿 터치 환경에서 자동 표시되는 아케이드 가상 컨트롤러 -->
    <section id="mobileControls" class="mobile-controls" aria-label="모바일 터치 컨트롤러">
      <!-- 좌측 360도 원형 아날로그 조이스틱 (세밀한 속도 및 대각선 조작 지원) -->
      <div id="joystickZone" class="joystick-zone" role="group" aria-label="360도 원형 방향 조이스틱">
        <div id="joystickBase" class="joystick-base">
          <span class="joy-dir joy-up" data-dir="up" aria-hidden="true">▲</span>
          <span class="joy-dir joy-left" data-dir="left" aria-hidden="true">◀</span>
          <span class="joy-dir joy-right" data-dir="right" aria-hidden="true">▶</span>
          <span class="joy-dir joy-down" data-dir="down" aria-hidden="true">▼</span>
          <div class="joystick-ring" aria-hidden="true"></div>
          <div id="joystickKnob" class="joystick-knob" aria-hidden="true">
            <div class="knob-highlight"></div>
          </div>
        </div>
      </div>

      <!-- 우측 대형 점프 / 시작 버튼 -->
      <div class="action-zone">
        <button type="button" id="btnMobileJump" class="jump-pad-btn" data-key="Space" aria-label="점프 및 시작">
          <span class="jump-main-txt">JUMP</span>
          <span class="jump-sub-txt">점프 / 시작</span>
        </button>
      </div>
    </section>
  </main>

  <!-- 필수 설정 전용 모달 -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settingsTitle">⚙️ 게임 설정</h2>
        <button type="button" id="btnCloseSettings" class="modal-close" aria-label="닫기">✕</button>
      </div>

      <div class="settings-list">
        <div class="setting-row">
          <span class="setting-label">사운드 (단축키 M)</span>
          <button type="button" id="btnSound" class="setting-btn active">🔊 사운드 ON</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">CRT 브라운관 효과</span>
          <button type="button" id="btnCrt" class="setting-btn active">📺 CRT ON</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">장애물 속도</span>
          <div class="diff-group">
            <button type="button" class="diff-btn active" data-difficulty="beginner">초보자</button>
            <button type="button" class="diff-btn" data-difficulty="intermediate">중급자</button>
            <button type="button" class="diff-btn" data-difficulty="advanced">고급자</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">스테이지 이동 (단축키 1~4)</span>
          <div class="stage-warp-group">
            <button type="button" class="stage-btn active" data-stage="1">25m</button>
            <button type="button" class="stage-btn" data-stage="2">50m</button>
            <button type="button" class="stage-btn" data-stage="3">75m</button>
            <button type="button" class="stage-btn" data-stage="4">100m</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">모바일 터치 패드</span>
          <button type="button" id="btnTouchPad" class="setting-btn active">🎮 자동 (모바일)</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">친구에게 추천하기</span>
          <button type="button" id="btnShareGame" class="setting-btn share-btn">📤 링크 공유 / 복사</button>
        </div>

        <div id="pwaInstallRow" class="setting-row">
          <span class="setting-label">스마트폰/PC 앱 설치</span>
          <button type="button" id="btnInstallPwa" class="setting-btn install-btn">📲 홈 화면에 앱 설치</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">게임 진행</span>
          <button type="button" id="btnRestartGame" class="setting-btn restart-btn">🔄 처음부터 재시작</button>
        </div>
      </div>

      <p id="pwaToastMsg" class="pwa-toast hidden"></p>
      <p class="settings-hint">PC: 방향키·Space(점프) / 모바일: 하단 터치패드</p>
    </div>
  </div>

  <!-- 게임 스크립트 -->
  <script src="./js/audio.js"></script>
  <script src="./js/sprites.js"></script>
  <script src="./js/stages.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/pwa.js"></script>
</body>
</html>
